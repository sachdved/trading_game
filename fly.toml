# fly.toml app configuration file generated for trading-game on 2026-07-19T16:11:42-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'trading-game'
primary_region = 'iad'

[build]

[env]
  PORT = '3000'
  STATE_DIR = '/data/state'
  TRUST_PROXY = '1'
  JOIN_URL = 'https://trading-game.fly.dev'

[mounts]
  source = 'gmdata'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
